<section class="card">
  <h1>Mon profil</h1>
  <button type="button" (click)="load()" [disabled]="loading()">
    {{ loading() ? 'Chargement…' : 'Recharger mon profil' }}
  </button>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  @if (success()) {
    <p role="status">{{ success() }}</p>
  }
  @if (currentUser(); as user) {
    <p>
      <b>{{ user.name }}</b><br />{{ user.email }}<br />
      Membre depuis {{ user.createdAt.slice(0, 10) }}
    </p>
    <form [formGroup]="form" (ngSubmit)="save()">
      <label for="profile-name">Nouveau nom</label>
      <input id="profile-name" formControlName="name" autocomplete="name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small class="error">Saisissez un nom non vide.</small>
      }
      <button type="submit" [disabled]="saving() || loading()">
        {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
      </button>
    </form>
  }
</section>
